name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Check Swift toolchain
        run: ./scripts/check-toolchain.sh

      - name: Security regression check
        run: ./scripts/security-check.sh --developer

      - name: Test Forge
        run: swift test

      - name: Build Forge
        run: swift build --product mlx-forge

      - name: Build Forge Graph
        run: ./scripts/build-rivet.sh
